<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | FarmaJovi</title><style>body{margin:0;background:#fff8f8;color:#382d32;font:16px system-ui;padding:30px}.box{max-width:1000px;margin:auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 35px #63343b1c}h1{color:#a85061}.btn{background:#c96879;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ecd9dd}th{background:#a85061;color:#fff}.muted{color:#705f65}</style></head><body><main class="box"><h1>Panel administrativo FarmaJovi</h1><p class="muted">Acceso privado para revisar las consultas del asistente.</p><button id="login" class="btn">Entrar con GitHub</button><button id="logout" class="btn" style="display:none">Cerrar sesión</button><p id="status" class="muted"></p><section id="panel" style="display:none"><h2>Interacciones recientes</h2><table><thead><tr><th>Fecha</th><th>Consulta</th><th>Respuesta</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const SB="https://bwytvofvxbkdntsoipmf.supabase.co",KEY="sb_publishable_vAgutfClE7NUInmPJEaSYg_-o6-KMIT",login=document.getElementById("login"),logout=document.getElementById("logout"),status=document.getElementById("status"),panel=document.getElementById("panel"),rows=document.getElementById("rows");const headers=t=>({apikey:KEY,Authorization:"Bearer "+t});login.onclick=()=>{location.href=SB+"/auth/v1/authorize?provider=github&redirect_to="+encodeURIComponent(location.href)};logout.onclick=()=>{location.hash="";location.reload()};function esc(v){return String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}async function load(){const p=new URLSearchParams(location.hash.slice(1)),token=p.get("access_token");if(!token){status.textContent="Inicia sesión con la cuenta administradora de GitHub.";return}const ur=await fetch(SB+"/auth/v1/user",{headers:headers(token)}),u=await ur.json();if(!ur.ok||u.email!=="farmacia.farmajovi@gmail.com"){status.textContent="Esta cuenta no tiene permisos de administrador.";return}login.style.display="none";logout.style.display="inline-block";status.textContent="Sesión iniciada como "+u.email;panel.style.display="block";const r=await fetch(SB+"/rest/v1/chat_interactions?select=created_at,question,answer&order=created_at.desc&limit=100",{headers:headers(token)}),data=await r.json();if(!r.ok){status.textContent="No se pudieron cargar las interacciones.";return}rows.innerHTML=data.map(x=>"<tr><td>"+new Date(x.created_at).toLocaleString("es-CL")+"</td><td>"+esc(x.question)+"</td><td>"+esc(x.answer||"")+"</td></tr>").join("")}load();</script></body></html>
