us.textContent="Esta cuenta no tiene permisos de administrador.";await client.auth.signOut();return}login.style.display="none";logout.style.display="inline-block";status.textContent="Sesión iniciada como "+user.email;panel.style.display="block";const{data,error}=await client.from("chat_interactions").select("created_at,question,answer").order("created_at",{ascending:false}).limit(100);if(error){status.textContent="No se pudieron cargar las interacciones.";return}rows.innerHTML=data.map(x=>"<tr><td>"+new Date(x.created_at).toLocaleString("es-CL")+"</td><td>"+esc(x.question)+"</td><td>"+esc(x.answer||"")+"</td></tr>").join("")}function esc(v){return String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}load();</script></body></html>
